services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathfindar-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist data (SQLite DB, reference images, logs) across restarts
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - DATA_PATH=./data
      - MODEL_PATH=./models
      - MAP_FILE=building_map.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Dev mode (hot-reload, mounted source) ──────────────────────────────────
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathfindar-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENV=development
      - LOG_LEVEL=DEBUG
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev
